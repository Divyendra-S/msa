# Invariants for the Bug Zoo shop. Each SQL query lists the rows that break the rule.

one-order-per-cart:
  description: A cart turns into at most one order.
  sql: SELECT cart_id, count(*) AS orders FROM orders GROUP BY cart_id HAVING count(*) > 1
  expect: empty

one-charge-per-order:
  description: An order is charged at most once.
  sql: >-
    SELECT order_id, count(DISTINCT charge_id) AS charges
    FROM payments GROUP BY order_id HAVING count(DISTINCT charge_id) > 1
  expect: empty

payment-recorded-once:
  description: Each charge is recorded as a payment exactly once.
  sql: >-
    SELECT order_id, charge_id, count(*) AS records
    FROM payments GROUP BY order_id, charge_id HAVING count(*) > 1
  expect: empty

paid-orders-are-marked-paid:
  description: An order with a recorded payment is not left pending or processing.
  sql: >-
    SELECT o.id, o.status FROM orders o
    WHERE o.status <> 'paid' AND EXISTS (SELECT 1 FROM payments p WHERE p.order_id = o.id)
  expect: empty

stock-non-negative:
  description: Stock never goes below zero.
  sql: SELECT id, stock FROM products WHERE stock < 0
  expect: empty

orders-need-a-live-session:
  description: Every order was placed while its buyer had a live (unexpired) session.
  sql: >-
    SELECT o.id, o.user_id, o.created_at FROM orders o
    WHERE NOT EXISTS (
      SELECT 1 FROM sessions s
      WHERE s.user_id = o.user_id AND o.created_at >= s.created_at AND o.created_at < s.expires_at)
  expect: empty

no-lost-update:
  description: No two saved product edits start from the same version (the later one silently overwrote the earlier).
  sql: >-
    SELECT product_id, base_version, count(*) AS saves
    FROM product_changes GROUP BY product_id, base_version HAVING count(*) > 1
  expect: empty

ordered-cart-matches-order:
  description: Everything in a cart that became an order is in that order, in the same quantity.
  sql: >-
    SELECT c.id AS cart_id, ci.product_id, ci.quantity AS in_cart, oi.quantity AS in_order
    FROM carts c
    JOIN orders o ON o.cart_id = c.id
    JOIN cart_items ci ON ci.cart_id = c.id
    LEFT JOIN order_items oi ON oi.order_id = o.id AND oi.product_id = ci.product_id
    WHERE oi.quantity IS DISTINCT FROM ci.quantity
  expect: empty

stock-matches-sales:
  description: Stock taken since the seed equals the units in orders that didn't fail.
  sql: >-
    SELECT p.id, p.stock, s.stock - coalesce(sold.units, 0) AS expected
    FROM products p
    JOIN windtunnel_seed.products s ON s.id = p.id
    LEFT JOIN (SELECT oi.product_id, sum(oi.quantity)::int AS units
                 FROM order_items oi JOIN orders o ON o.id = oi.order_id
                WHERE o.status <> 'failed' GROUP BY oi.product_id) sold ON sold.product_id = p.id
    WHERE p.stock <> s.stock - coalesce(sold.units, 0)
  expect: empty

# The next two also read what happened in the browser: every request with its user and
# status (windtunnel_requests), and what each page said when a step ended (windtunnel_pages).

orders-shown-only-to-their-buyer:
  description: An order is shown only to the user who placed it; anyone else asking for it is refused.
  sql: >-
    SELECT r.user_name AS reader, r.method, r.path, r.status, o.user_id AS buyer
    FROM windtunnel_requests r
    JOIN users u ON u.email = r.user_email
    JOIN orders o ON o.id = substring(r.path from '^/(?:api/)?orders/(\d+)$')::int
    WHERE r.status = 200 AND o.user_id <> u.id
  expect: empty

confirmation-means-paid:
  description: When a page says "Order confirmed", its user has a paid order.
  sql: >-
    SELECT p.tab, p.step, p.path FROM windtunnel_pages p
    JOIN users u ON u.email = p.user_email
    WHERE p.text LIKE '%Order confirmed%'
      AND NOT EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.id AND o.status = 'paid')
  expect: empty

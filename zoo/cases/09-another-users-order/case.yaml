id: 09-another-users-order
title: Another user's order (IDOR)
summary: The order status API checks that someone is logged in but not that the order is theirs, so any user can read any order by its id.
experiment: order-read-by-another-user
perturbation: Bob sends Alice's order status request with his own session
breaks: [orders-shown-only-to-their-buyer]
handler: app/api/orders/[id]/route.ts
fix: Look the order up by id and owner (WHERE id = $1 AND user_id = $2); answer 404 otherwise.

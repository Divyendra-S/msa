# Postgres for Wind Tunnel development and the Bug Zoo.
# log_statement=all feeds the trace chain (SQL per request). fsync is off
# because every database here is a disposable copy.
services:
  postgres:
    image: postgres:17-alpine
    container_name: windtunnel-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_line_prefix=%m [%p] %d %a 
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
